<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Viking Rise Trading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap">
<style>
/* Layout: one column tool, tab bar on top; grids mirror the in-game album. Dark-first like the game. */
:root{
  --bg:#14120f; --surface:#1d1a16; --surface2:#26221c; --line:#3a342b;
  --fg:#ece6da; --muted:#a39a8a; --faint:#6e665a;
  --gold:#e0b44c; --gold-bg:#3a2e12; --violet:#b48cf0; --violet-bg:#2c2140; --blue:#6fb0f0; --blue-bg:#152a40;
  --good:#7fcf8a; --bad:#ef7a6a;
  --display:"Cinzel",Georgia,serif; --body:"Barlow",system-ui,sans-serif; --label:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f6f2ea; --surface:#fffdf8; --surface2:#efe8db; --line:#ddd2bf;
  --fg:#231e17; --muted:#6c6253; --faint:#a59a87;
  --gold:#9a6d06; --gold-bg:#f6e6bb; --violet:#6b3fb8; --violet-bg:#ece2fb; --blue:#1e64ad; --blue-bg:#dceafa;
  --good:#2f7d3b; --bad:#b33a2b; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f6f2ea; --surface:#fffdf8; --surface2:#efe8db; --line:#ddd2bf;
  --fg:#231e17; --muted:#6c6253; --faint:#a59a87;
  --gold:#9a6d06; --gold-bg:#f6e6bb; --violet:#6b3fb8; --violet-bg:#ece2fb; --blue:#1e64ad; --blue-bg:#dceafa;
  --good:#2f7d3b; --bad:#b33a2b; color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);margin:0}
.wrap{max-width:860px;margin:0 auto;padding:0 16px;padding-block:18px 60px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.top>div:first-child{min-width:0;flex:1 1 260px}
h1{font:700 1.45rem/1.15 var(--display);letter-spacing:.02em;margin:0;color:var(--gold);text-wrap:balance}
.sub{color:var(--muted);font-size:.9rem;margin-top:4px}
.lbl{font:600 .78rem var(--label);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;margin:16px -16px 14px;padding:8px 16px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{font:600 .95rem var(--label);letter-spacing:.04em;background:none;border:0;color:var(--muted);padding:7px 12px;border-radius:7px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface2);color:var(--fg)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.banner{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:.9rem;margin-top:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input[type=text]{font:inherit;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;max-width:100%}
.btn{font:600 .9rem var(--label);letter-spacing:.04em;background:var(--surface2);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:7px 12px;cursor:pointer}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#1a1408}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--surface);border:0;color:var(--muted);padding:7px 12px;font:600 .9rem var(--label);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface2);color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 11px;font:500 .9rem var(--body);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-bg)}
.stats{display:flex;flex-wrap:wrap;gap:18px;margin:4px 0 14px}
.stat b{display:block;font:600 1.5rem var(--label);font-variant-numeric:tabular-nums}
.trade{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.trade.mine .n{background:var(--gold);color:#1a1408}
.n{width:26px;height:26px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font:600 .85rem var(--label);font-variant-numeric:tabular-nums}
.who{font-weight:600}
.det{color:var(--muted);font-size:.9rem;margin-top:2px;min-width:0}
.pc{display:inline-block;font:600 .85rem var(--label);letter-spacing:.03em;padding:1px 7px;border-radius:5px;margin:1px 0}
.pc.g{background:var(--gold-bg);color:var(--gold)} .pc.p{background:var(--violet-bg);color:var(--violet)} .pc.b{background:var(--blue-bg);color:var(--blue)}
.tag{font:600 .75rem var(--label);letter-spacing:.06em;text-transform:uppercase;color:var(--good)}
.tag.zero{color:var(--faint)}
.empty{color:var(--muted);padding:18px 0}
.tablewrap{overflow-x:auto;margin-bottom:18px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.92rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:600 .78rem var(--label);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
td.g{color:var(--gold)} td.p{color:var(--violet)} td.b{color:var(--blue)}
.bar{height:4px;background:var(--surface2);border-radius:2px;margin-top:3px;min-width:60px}
.bar i{display:block;height:100%;border-radius:2px;background:currentColor}
.colorsec{margin-top:20px}
.colorsec h3{font:600 1.05rem var(--display);margin:0 0 8px}
.colorsec.g h3{color:var(--gold)} .colorsec.p h3{color:var(--violet)} .colorsec.b h3{color:var(--blue)}
.albums{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.album{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.album .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:8px}
.album .hd span{font:600 .95rem var(--label);letter-spacing:.03em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.album .hd small.en{display:block;font:500 .72rem var(--body);color:var(--faint);letter-spacing:0;overflow:hidden;text-overflow:ellipsis}
.dayhd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:22px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.dayhd span{font:600 1.05rem var(--display)}
.dayhd.now span{color:var(--gold)}
.dayhd em{font-style:normal;color:var(--muted);font-size:.85rem;white-space:nowrap}
.dayhd+.trade{border-top:0}
.album .hd em{font-style:normal;color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.album.done{border-color:var(--good)}
.grid{display:grid;gap:3px}
.cell{position:relative;aspect-ratio:1;border:1px dashed var(--line);border-radius:5px;background:transparent;color:var(--faint);font:500 .72rem var(--label);cursor:pointer;padding:0;display:grid;place-items:center;max-width:100%}
.cell.have{border-style:solid}
.g .cell.have{background:var(--gold-bg);border-color:var(--gold);color:var(--gold)}
.p .cell.have{background:var(--violet-bg);border-color:var(--violet);color:var(--violet)}
.b .cell.have{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}
.cell .d{position:absolute;right:-3px;top:-5px;background:var(--fg);color:var(--bg);border-radius:8px;font:600 .66rem var(--label);padding:0 4px;line-height:14px}
.cell:disabled{cursor:default}
.hole{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:baseline;flex-wrap:wrap}
.hole .m{color:var(--muted);font-size:.9rem;min-width:0}
details{margin-top:14px} summary{cursor:pointer;color:var(--muted)}
.note{color:var(--muted);font-size:.88rem}
.welcome{max-width:460px;padding-block:30px;display:grid;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.9rem;z-index:9;max-width:calc(100% - 32px);overflow-wrap:anywhere}
@media (prefers-reduced-motion:no-preference){.cell{transition:background .12s}}
</style>

</head>

  <div id="banner"></div>

</div>

function claudeAdapter(db){return{
  subPlayers:(cb,err)=>db.collection('players').onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))),err),
  subConfig:cb=>db.doc('config/main').onSnapshot(d=>cb(d.exists?d.data():{})),
  subTrades:cb=>db.collection('trades').orderBy('at','desc').limit(500).onSnapshot(s=>cb(s.docs.map(d=>d.data()))),
  updatePlayer:(pid,f,sh)=>{const d={};if(Object.keys(f).length)d.a=f;if(sh!=null)d.shards=sh;return db.doc('players/'+pid).update(d)},
  setPlayer:(id,data)=>db.doc('players/'+id).set(data),
  deletePlayer:id=>db.doc('players/'+id).delete(),
  addTrade:data=>db.collection('trades').add(data),
  setConfig:data=>db.doc('config/main').set({...S.config,...data})}}
async function firebaseAdapter(cfg,team){
  const V='10.12.2';
  const app=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const fs=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  const db=fs.getFirestore(app.initializeApp(cfg));
  const col=n=>fs.collection(db,'teams',team,n), doc=(n,id)=>fs.doc(db,'teams',team,n,id);
  return{
    subPlayers:(cb,err)=>fs.onSnapshot(col('players'),s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))),err),
    subConfig:cb=>fs.onSnapshot(doc('meta','config'),d=>cb(d.exists()?d.data():{})),
    subTrades:cb=>fs.onSnapshot(fs.query(col('trades'),fs.orderBy('at','desc'),fs.limit(500)),s=>cb(s.docs.map(d=>d.data()))),
    updatePlayer:(pid,f,sh)=>{const u={};for(const k in f)u['a.'+k]=f[k];if(sh!=null)u.shards=sh;return fs.updateDoc(doc('players',pid),u)},
    setPlayer:(id,data)=>fs.setDoc(doc('players',id),data),
    deletePlayer:id=>fs.deleteDoc(doc('players',id)),
    addTrade:data=>fs.addDoc(col('trades'),data),
    setConfig:data=>fs.setDoc(doc('meta','config'),data,{merge:true})}}

function str(p,key){const pend=S.pending[p.id];if(pend&&pend[key]!=null)return pend[key];const s=(p.a||{})[key];const n=ALB[key].n;return (typeof s==='string'&&s.length===n)?s:'0'.repeat(n)}
function shardsOf(p){const pend=S.pending[p.id];if(pend&&pend.shards!=null)return pend.shards;return Number(p.shards)||0}
function setShards(pid,n){(S.pending[pid]||(S.pending[pid]={})).shards=Math.max(0,Math.min(999,n));clearTimeout(S.pending[pid]._t);S.pending[pid]._t=setTimeout(()=>flush(pid),500)}
function playerList(){return Object.values(S.players).sort((a,b)=>(a.order??99)-(b.order??99)||a.name.localeCompare(b.name))}
function snapshotCounts(){const m={};for(const p of playerList()){m[p.id]={};for(const k of ALLKEYS)m[p.id][k]=str(p,k).split('').map(Number)}return m}

/* ---------- writes ---------- */
function setStr(pid,key,s){(S.pending[pid]||(S.pending[pid]={}))[key]=s;clearTimeout(S.pending[pid]._t);S.pending[pid]._t=setTimeout(()=>flush(pid),500)}
async function flush(pid){
  if(S.writing[pid]||!S.api)return;const pend=S.pending[pid];if(!pend)return;
  const fields={};for(const k of ALLKEYS)if(pend[k]!=null)fields[k]=pend[k];
  const sh=pend.shards;
  if(!Object.keys(fields).length&&sh==null)return;
  S.writing[pid]=true;
  try{await S.api.updatePlayer(pid,fields,sh);for(const k in fields)if(pend[k]===fields[k])delete pend[k];if(sh!=null&&pend.shards===sh)delete pend.shards}
  catch(e){handleWriteErr(e);for(const k in fields)delete pend[k];delete pend.shards}
  finally{S.writing[pid]=false}
  if(ALLKEYS.some(k=>pend[k]!=null)||pend.shards!=null)flush(pid);else render();
}
function handleWriteErr(e){const c=e&&e.code;if(c==='invalid_argument'||c==='permission-denied'){S.ro=true;toast(T('noEdit'))}else toast(T('saveFail'));render()}
function bump(pid,key,idx,delta){const s=str(S.players[pid],key);const v=Math.max(0,Math.min(9,Number(s[idx])+delta));if(v===Number(s[idx]))return;setStr(pid,key,s.slice(0,idx)+v+s.slice(idx+1))}

/* ---------- planner ---------- */
function planStep(C,cap,split){
  const ids=Object.keys(C);
  const canReq=id=>split?cap[id].req>0:cap[id].tot>0, canAcc=id=>split?cap[id].acc>0:cap[id].tot>0;
  const out=[];
  for(let guard=0;guard<80;guard++){
    const miss={},dem={};
    for(const id of ids)for(const k of ALLKEYS)miss[id+k]=C[id][k].filter(v=>v===0).length;
    for(const k of ALLKEYS){dem[k]=new Array(ALB[k].n).fill(0);for(const id of ids)C[id][k].forEach((v,i)=>{if(v===0)dem[k][i]++})}
    const gain=(id,k,i)=>C[id][k][i]===0?CBY[ALB[k].c].w*(1+4/miss[id+k]):0;
    let best=null;
    for(const A of ids){if(!canReq(A))continue;
      for(const B of ids){if(A===B||!canAcc(B))continue;
        for(const c of COLORS){
          let y=null,x=null;
          for(const k of KEYS(c)){const a=C[A][k],b=C[B][k];
            for(let i=0;i<a.length;i++){
              if(b[i]>=2){const g=gain(A,k,i);const sc=g*1000+b[i]-dem[k][i]*(g?0:5);if(!y||sc>y.sc)y={k,i,g,sc}}
              if(a[i]>=2){const g=gain(B,k,i);const sc=g*1000+a[i]-dem[k][i]*(g?0:5);if(!x||sc>x.sc)x={k,i,g,sc}}}}
          if(!x||!y)continue;const tot=x.g+y.g;if(tot<=0)continue;
          const score=tot+(x.g&&y.g?0.01:0);
          if(!best||score>best.score)best={score,A,B,x,y}}}}
    if(!best)break;
    const {A,B,x,y}=best;
    const compA=!!(y.g&&miss[A+y.k]===1), compB=!!(x.g&&miss[B+x.k]===1);
    C[A][x.k][x.i]--;C[B][x.k][x.i]++;C[B][y.k][y.i]--;C[A][y.k][y.i]++;
    if(split){cap[A].req--;cap[B].acc--}else{cap[A].tot--;cap[B].tot--}
    out.push({req:A,acc:B,give:{k:x.k,i:x.i},get:{k:y.k,i:y.i},gReq:y.g>0,gAcc:x.g>0,compA,compB});
  }
  return out;
}
/* Simulates the coming days with today's pieces: day 0 uses what is left of today's limit, then each day resets it. */
let planCache={key:null,val:null};
function planDays(maxDays=30){
  const C=snapshotCounts();
  const key=S.config.mode+'|'+today()+'|'+S.trades.filter(x=>x.day===today()).map(x=>x.req+x.acc).join(',')+'|'+JSON.stringify(C);
  if(planCache.key===key)return planCache.val;
  const val=planDaysRaw(C,maxDays);planCache={key,val};return val;
}
function planDaysRaw(C,maxDays){const ids=Object.keys(C);const t=today();const split=S.config.mode==='split';
  const days=[];
  for(let d=0;d<maxDays;d++){
    const cap={};for(const id of ids)cap[id]=split?{req:1,acc:1}:{tot:2};
    if(d===0)for(const tr of S.trades)if(tr.day===t){
      if(cap[tr.req]){if(split)cap[tr.req].req--;else cap[tr.req].tot--}
      if(cap[tr.acc]){if(split)cap[tr.acc].acc--;else cap[tr.acc].tot--}}
    const trades=planStep(C,cap,split);
    if(!trades.length){if(d===0)continue;break}
    days.push({d,trades});
  }
  return days;
}
async function markDone(tr){
  if(S.ro||!S.api)return;
  const A=S.players[tr.req],B=S.players[tr.acc];if(!A||!B)return;
  const ch=(p,k,i,d)=>{const s=str(p,k);const v=Math.min(9,Math.max(0,Number(s[i])+d));setStr(p.id,k,s.slice(0,i)+v+s.slice(i+1))};
  ch(A,tr.give.k,tr.give.i,-1);ch(B,tr.give.k,tr.give.i,+1);ch(B,tr.get.k,tr.get.i,-1);ch(A,tr.get.k,tr.get.i,+1);
  try{await S.api.addTrade({at:Date.now(),day:today(),req:tr.req,acc:tr.acc,give:tr.give,get:tr.get});toast(T('saved'))}
  catch(e){handleWriteErr(e)}
  render();
}

function shardTips(){
  const C=snapshotCounts();const ids=Object.keys(C);const out=[];
  for(const id of ids){let s=shardsOf(S.players[id]);if(!s)continue;const mine=JSON.parse(JSON.stringify(C[id]));
    while(s>0){let best=null;
      for(const k of ALLKEYS){const miss=mine[k].filter(v=>v===0).length;if(!miss)continue;
        for(let i=0;i<mine[k].length;i++){if(mine[k][i]!==0)continue;if(ids.some(o=>o!==id&&C[o][k][i]>=2))continue;
          const sc=CBY[ALB[k].c].w*(1+4/miss);if(!best||sc>best.sc)best={k,i,sc,comp:miss===1}}}
      if(!best)break;mine[best.k][best.i]=1;out.push({pid:id,k:best.k,i:best.i,comp:best.comp});s--}}
  return out;
}
async function useShard(pid,k,i){const p=S.players[pid];if(!p||!canEdit())return;const n=shardsOf(p);if(n<1)return;
  const s=str(p,k);if(s[i]!=='0')return;setStr(pid,k,s.slice(0,i)+'1'+s.slice(i+1));setShards(pid,n-1);toast(T('used',{x:albumName(k)+' #'+(i+1)}));render()}

/* ---------- render ---------- */
const canEdit=()=>!!S.api&&!S.ro;
function nm(id){return esc(S.players[id]?.name||'?')}
function renderChrome(){
  document.documentElement.lang=S.lang;$('#lang').value=S.lang;$('#sub').textContent=T('sub');
  const tl={plan:'tabPlan',stanje:'tabCol',rupe:'tabGaps',istorija:'tabHist'};
  document.querySelectorAll('.tabs button').forEach(b=>{b.textContent=T(tl[b.dataset.tab]);b.setAttribute('aria-selected',b.dataset.tab===S.tab)});
  const cl=$('#copylink');cl.hidden=!FIREBASE_CONFIG||!S.api;cl.textContent=T('copyLink');
  let h='';
  if(S.loaded&&!S.api)h=`<div class="banner">${esc(T('noDb'))}</div>`;
  else if(S.ro)h=`<div class="banner">${esc(T('readOnly'))}</div>`;
  $('#banner').innerHTML=h;
}
function dayLabel(d){
  const dt=new Date();dt.setDate(dt.getDate()+d);
  let f='';try{f=new Intl.DateTimeFormat(S.lang,{weekday:'short',day:'numeric',month:'short'}).format(dt)}catch(_){f=dt.toDateString()}
  return d===0?T('today')+' · '+f:d===1?T('tomorrow')+' · '+f:f;
}
function renderPlan(){
  const ps=playerList();const el=$('#tab-plan');
  if(!S.loaded){el.innerHTML=`<div class="empty">${T('loading')}</div>`;return}
  if(!ps.length){el.innerHTML=`<div class="empty">${esc(T('noPlayers'))}</div>`;return}
  const days=planDays();const all=days.flatMap(x=>x.trades);const t=today();const done=S.trades.filter(x=>x.day===t).length;
  const newPieces=all.reduce((s,x)=>s+(x.gReq?1:0)+(x.gAcc?1:0),0);
  const gold=all.reduce((s,x)=>s+(x.give.k[0]==='g'&&x.gAcc?1:0)+(x.get.k[0]==='g'&&x.gReq?1:0),0);
  const comps=all.reduce((s,x)=>s+(x.compA?1:0)+(x.compB?1:0),0);
  let h=`<div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="note">${esc(T('limit',{x:S.config.mode==='split'?T('limSplit'):T('lim2')}))}</span></div>
    <div class="stats"><div class="stat"><span class="lbl">${T('daysLbl')}</span><b>${days.length}</b></div>
    <div class="stat"><span class="lbl">${T('trades')}</span><b>${all.length}</b></div>
    <div class="stat"><span class="lbl">${T('newPieces')}</span><b>${newPieces}</b></div>
    <div class="stat"><span class="lbl">${T('goldPieces')}</span><b style="color:var(--gold)">${gold}</b></div>
    <div class="stat"><span class="lbl">${T('completions')}</span><b style="color:var(--good)">${comps}</b></div>
    <div class="stat"><span class="lbl">${T('doneToday')}</span><b>${done}</b></div></div>`;
  if(!all.length)h+=`<div class="empty">${esc(T('noTrades'))}</div>`;
  else h+=`<p class="note">${esc(T('forecastNote'))}</p>`;
  const gainTxt=(g,c)=>g?`<span class="tag">${esc(c?T('completes'):T('newPiece'))}</span>`:`<span class="tag zero">${esc(T('duplicate'))}</span>`;
  let todayTrades=[];
  for(const day of days){
    if(day.d===0)todayTrades=day.trades;
    h+=`<div class="dayhd${day.d===0?' now':''}"><span>${esc(dayLabel(day.d))}</span><em>${day.trades.length} ${esc(T('trades').toLowerCase())}</em></div>`;
    day.trades.forEach((x,n)=>{
      h+=`<div class="trade"><div class="n">${n+1}</div><div style="min-width:0">
        <div>${T('offers',{a:`<span class="who">${nm(x.req)}</span>`,x:pcHtml(x.give.k,x.give.i),y:pcHtml(x.get.k,x.get.i)})}</div>
        <div class="det">${T('accepted',{b:`<b>${nm(x.acc)}</b>`})} · ${nm(x.req)}: ${gainTxt(x.gReq,x.compA)} · ${nm(x.acc)}: ${gainTxt(x.gAcc,x.compB)}</div></div>
        ${day.d===0?`<button class="btn" data-done="${n}" ${canEdit()?'':'disabled'}>${esc(T('done'))}</button>`:'<span></span>'}</div>`});
  }
  const tips=shardTips();
  if(ps.some(p=>shardsOf(p)>0)){
    h+=`<h3 class="lbl" style="margin-top:22px">${esc(T('shardTitle'))}</h3><p class="note">${esc(T('shardNote'))}</p>`;
    if(!tips.length)h+=`<div class="empty">${esc(T('noShardTips'))}</div>`;
    tips.forEach(x=>{h+=`<div class="hole" style="justify-content:space-between"><span class="m" style="min-width:0"><b>${nm(x.pid)}</b> (${shardsOf(S.players[x.pid])}) · ${pcHtml(x.k,x.i)}${x.comp?` <span class="tag">${esc(T('completes'))}</span>`:''}</span><button class="btn" data-use="${x.pid}|${x.k}|${x.i}" ${canEdit()?'':'disabled'}>${esc(T('use'))}</button></div>`});
  }
  h+=`<details><summary>${esc(T('howTitle'))}</summary><p class="note">${esc(T('howText'))}</p>
  ${canEdit()?`<div class="row"><span class="lbl">${esc(T('limitRule'))}</span><div class="seg"><button data-mode="total" aria-pressed="${S.config.mode!=='split'}">${esc(T('any2'))}</button><button data-mode="split" aria-pressed="${S.config.mode==='split'}">${esc(T('split'))}</button></div></div>`:''}</details>`;
  el.innerHTML=h;el._plan=todayTrades;
}
function renderStanje(){
  const el=$('#tab-stanje');const prevName=document.getElementById('newname')?.value||'';const ps=playerList();
  if(!S.loaded){el.innerHTML=`<div class="empty">${T('loading')}</div>`;return}
  let h='';
  if(ps.length){
    h+=`<div class="tablewrap"><table><thead><tr><th>${T('player')}</th>${COLORS.map(c=>`<th>${T(c.k)}</th>`).join('')}<th>${esc(T('shards'))}</th></tr></thead><tbody>`;
    for(const p of ps){h+=`<tr><td>${esc(p.name)}</td>`;
      for(const c of COLORS){let have=0,full=0,tot=0;for(const k of KEYS(c)){const s=str(p,k);const hv=[...s].filter(v=>v!=='0').length;have+=hv;tot+=ALB[k].n;if(hv===ALB[k].n)full++}
        h+=`<td class="${c.k}">${have}/${tot}${full?` · ${full}✓`:''}<div class="bar"><i style="width:${(have/tot*100).toFixed(1)}%"></i></div></td>`}
      h+=`<td>${shardsOf(p)}</td></tr>`}
    h+='</tbody></table></div>';
  }else h+=`<div class="empty">${esc(T('noPlayers'))}</div>`;
  if(!S.sel||!S.players[S.sel])S.sel=S.me&&S.players[S.me]?S.me:ps[0]?.id;
  h+=`<div class="chips" style="margin-bottom:10px">${ps.map(p=>`<button class="chip" data-sel="${p.id}" aria-pressed="${p.id===S.sel}">${esc(p.name)}</button>`).join('')}</div>`;
  if(canEdit()&&ps.length)h+=`<div class="row" style="margin-bottom:6px"><div class="seg"><button data-em="add" aria-pressed="${S.editMode==='add'}">${esc(T('add'))}</button><button data-em="sub" aria-pressed="${S.editMode==='sub'}">${esc(T('remove'))}</button></div><span class="note">${esc(T('tapHint'))}</span></div>`;
  const p=S.players[S.sel];
  if(p)h+=`<div class="row" style="margin:10px 0 4px"><span class="lbl">${esc(T('shardTitle'))}</span>${canEdit()?`<button class="btn" data-shard="-1" aria-label="−">−</button>`:''}<b style="font:600 1.2rem var(--label);min-width:2ch;text-align:center;font-variant-numeric:tabular-nums">${shardsOf(p)}</b>${canEdit()?`<button class="btn" data-shard="1" aria-label="+">+</button>`:''}</div>`;
  if(p)for(const c of COLORS){
    h+=`<div class="colorsec ${c.k}"><h3>${T(c.k)}</h3><div class="albums">`;
    for(const k of KEYS(c)){const A=ALB[k];const s=str(p,k);const hv=[...s].filter(v=>v!=='0').length;const dup=[...s].reduce((a,v)=>a+Math.max(0,v-1),0);
      h+=`<div class="album${hv===A.n?' done':''}"><div class="hd"><span title="${esc(A.name)}">${esc(albumName(k))}${S.lang!=='en'?`<small class="en">${esc(A.name)}</small>`:''}</span><em>${hv}/${A.n}${dup?` · ${dup} ${esc(T('dupShort'))}`:''}</em></div><div class="grid" style="grid-template-columns:repeat(${A.cols},1fr)">`;
      for(let i=0;i<A.n;i++){const v=+s[i];h+=`<button class="cell${v?' have':''}" data-cell="${k}:${i}" aria-label="${esc(albumName(k))} #${i+1}: ${esc(v?T('cellDup',{n:v-1}):T('cellMissing'))}" ${canEdit()?'':'disabled'}>${i+1}${v>1?`<span class="d">+${v-1}</span>`:''}</button>`}
      h+='</div></div>'}
    h+='</div></div>'}
  if(canEdit()){
    h+=`<form id="addp" class="row" style="margin-top:22px"><input type="text" id="newname" placeholder="${esc(T('newName'))}" maxlength="30" aria-label="${esc(T('newName'))}"><button class="btn" type="submit">${esc(T('addPlayer'))}</button></form>`;
    if(p)h+=S.confirmDel?`<div class="row" style="margin-top:12px"><span>${esc(T('confirmRemove',{n:p.name}))}</span><button class="btn danger" data-delyes="1">${esc(T('removePlayer'))}</button><button class="btn" data-delno="1">${esc(T('cancel'))}</button></div>`
      :`<div style="margin-top:12px"><button class="btn danger" data-del="1">${esc(T('removePlayer'))}: ${esc(p.name)}</button></div>`;
  }
  el.innerHTML=h;const ni=document.getElementById('newname');if(ni&&prevName)ni.value=prevName;
}
function renderRupe(){
  const el=$('#tab-rupe');const C=snapshotCounts();const ids=Object.keys(C);
  if(!ids.length){el.innerHTML=`<div class="empty">${esc(T('noData'))}</div>`;return}
  let holes='',extra='';
  for(const k of ALLKEYS)for(let i=0;i<ALB[k].n;i++){
    const missing=ids.filter(id=>C[id][k][i]===0),dupers=ids.filter(id=>C[id][k][i]>=2);
    if(missing.length&&!dupers.length)holes+=`<div class="hole">${pcHtml(k,i)}<span class="m">${T('missingList',{list:missing.map(nm).join(', ')})}</span></div>`;
    if(!missing.length&&dupers.length)extra+=`<div class="hole">${pcHtml(k,i)}<span class="m">${dupers.map(id=>nm(id)+(C[id][k][i]>2?' ×'+(C[id][k][i]-1):'')).join(', ')}</span></div>`;
  }
  el.innerHTML=`<p class="note">${esc(T('gapsInfo'))}</p>
  <h3 class="lbl" style="margin-top:16px">${esc(T('gaps'))}</h3>${holes||`<div class="empty">${esc(T('noGaps'))}</div>`}
  <h3 class="lbl" style="margin-top:22px">${esc(T('extras'))}</h3>${extra||`<div class="empty">${esc(T('noExtras'))}</div>`}`;
}
function renderIstorija(){
  const el=$('#tab-istorija');
  const list=S.trades.filter(t=>ALB[t.give?.k]&&ALB[t.get?.k]);
  if(!list.length){el.innerHTML=`<div class="empty">${esc(T('noHist'))}</div>`;return}
  el.innerHTML=list.slice(0,200).map(t=>`<div class="hole"><span class="lbl">${esc(t.day)}</span><span class="m">${T('gave',{a:`<b>${nm(t.req)}</b>`,x:pcHtml(t.give.k,t.give.i),b:`<b>${nm(t.acc)}</b>`,y:pcHtml(t.get.k,t.get.i)})}</span></div>`).join('');
}
function render(){
  renderChrome();
  if(!$('#tab-plan'))return;
  for(const t of ['plan','stanje','rupe','istorija'])$('#tab-'+t).hidden=t!==S.tab;
  ({plan:renderPlan,stanje:renderStanje,rupe:renderRupe,istorija:renderIstorija})[S.tab]();
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tab){S.tab=b.dataset.tab;ls.set('tab',S.tab);render();return}
  if(b.dataset.sel){S.sel=b.dataset.sel;S.confirmDel=false;render();return}
  if(b.dataset.em){S.editMode=b.dataset.em;render();return}
  if(b.dataset.cell&&canEdit()){const [k,i]=b.dataset.cell.split(':');bump(S.sel,k,+i,S.editMode==='add'?1:-1);render();return}
  if(b.dataset.done!=null){const tr=$('#tab-plan')._plan[+b.dataset.done];b.disabled=true;markDone(tr);return}
  if(b.dataset.mode&&canEdit()){S.config.mode=b.dataset.mode;S.api.setConfig({mode:b.dataset.mode}).catch(handleWriteErr);render();return}
  if(b.dataset.shard&&canEdit()&&S.players[S.sel]){setShards(S.sel,shardsOf(S.players[S.sel])+Number(b.dataset.shard));render();return}
  if(b.dataset.use&&canEdit()){const [pid,k,i]=b.dataset.use.split('|');b.disabled=true;useShard(pid,k,+i);return}
  if(b.dataset.del){S.confirmDel=true;render();return}
  if(b.dataset.delno){S.confirmDel=false;render();return}
  if(b.dataset.delyes&&canEdit()){const p=S.players[S.sel];S.confirmDel=false;if(!p)return;
    try{await S.api.deletePlayer(p.id);toast(T('removed',{n:p.name}));S.sel=null}catch(err){handleWriteErr(err)}return}
  if(b.id==='copylink'){const url=location.href;try{await navigator.clipboard.writeText(url);toast(T('copied'))}catch(_){toast(url)}return}
  if(b.id==='createteam'){b.disabled=true;createTeam();return}
});
document.addEventListener('change',e=>{
  if(e.target.id==='me'){S.me=e.target.value||null;ls.set('me',S.me||'');render()}
  if(e.target.id==='lang'){S.lang=e.target.value;ls.set('lang',S.lang);if($('#createteam'))showWelcome();else render()}
});
document.addEventListener('submit',async e=>{
  if(e.target.id!=='addp')return;e.preventDefault();
  const name=$('#newname').value.trim();if(!name||!canEdit())return;
  const id=slug(name);
  if(S.players[id]){toast(T('exists'));return}
  const order=Math.max(0,...playerList().map(p=>p.order||0))+1;
  try{await S.api.setPlayer(id,{name,order,shards:0,a:emptyAlbums()});$('#newname').value='';S.sel=id;toast(T('added',{n:name}))}catch(err){handleWriteErr(err)}
});

/* ---------- imports from imports.json (pushed to the repo) ---------- */
let importsRun=false;
async function runImports(){
  if(importsRun||!FIREBASE_CONFIG||!S.api||!S.loaded||!S.configLoaded||S.ro)return;importsRun=true;
  let data;try{const r=await fetch('imports.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;data=await r.json()}catch(_){return}
  const applied=new Set(S.config.applied||[]);const todo=(data.imports||[]).filter(x=>x&&x.id&&!applied.has(x.id));
  if(!todo.length)return;
  const names=[];
  for(const im of todo){
    try{
      const id=slug(String(im.player||''));if(!id)continue;
      const albums={};for(const k in (im.albums||{}))if(ALB[k]&&typeof im.albums[k]==='string'&&new RegExp('^[0-9]{'+ALB[k].n+'}$').test(im.albums[k]))albums[k]=im.albums[k];
      const sh=Number.isFinite(im.shards)?Math.max(0,Math.round(im.shards)):null;
      if(!S.players[id]){const order=Math.max(0,...playerList().map(p=>p.order||0))+1;const a=emptyAlbums();Object.assign(a,albums);
        await S.api.setPlayer(id,{name:String(im.player),order,shards:sh??0,a});}
      else await S.api.updatePlayer(id,albums,sh);
      applied.add(im.id);names.push(String(im.player));
    }catch(e){console.warn('import failed',im.id,e)}
  }
  try{await S.api.setConfig({applied:[...applied].slice(-500)})}catch(_){}
  if(names.length)toast(T('imported',{n:[...new Set(names)].join(', ')}));
}

/* ---------- boot ---------- */
function startSubs(){
  S.api.subPlayers(list=>{const m={};for(const v of list)m[v.id]={id:v.id,name:v.name||v.id,order:v.order,a:v.a||{},shards:v.shards||0};S.players=m;S.loaded=true;render();runImports()},
    err=>{S.loaded=true;if(err&&err.code==='permission-denied')S.api=null;render()});
  S.api.subConfig(v=>{S.config={mode:(v&&v.mode)||'total',applied:(v&&v.applied)||[]};S.configLoaded=true;render();runImports()});
  S.api.subTrades(list=>{S.trades=list;render()});
}
const teamId=()=>{const h=location.hash.slice(1);return /^[A-Za-z0-9_-]{20,64}$/.test(h)?h:null};
function showWelcome(){
  renderChrome();$('#app').innerHTML=`<div class="welcome"><b>${esc(T('welcome'))}</b><p class="note">${esc(T('welcomeNote'))}</p><div><button class="btn primary" id="createteam">${esc(T('createTeam'))}</button></div></div>`;
}
async function createTeam(){
  const a=new Uint8Array(20);crypto.getRandomValues(a);
  const id=Array.from(a,x=>'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'[x%62]).join('');
  try{const api=await firebaseAdapter(FIREBASE_CONFIG,id);
    for(const [i,name] of DEFAULT_PLAYERS.entries())await api.setPlayer(slug(name),{name,order:i+1,shards:0,a:emptyAlbums()});
    await api.setConfig({mode:'total'});
  }catch(e){toast(T('saveFail'));const b=$('#createteam');if(b)b.disabled=false;return}
  location.hash=id;location.reload();
}
(async()=>{
  render();
  if(FIREBASE_CONFIG){
    const tid=teamId();
    if(!tid){showWelcome();return}
    try{S.api=await firebaseAdapter(FIREBASE_CONFIG,tid);startSubs()}catch(e){S.loaded=true;render()}
    window.addEventListener('hashchange',()=>location.reload());
    return;
  }
  const db=await window.claude?.use?.('db');
  if(!db){S.loaded=true;render();return}
  S.api=claudeAdapter(db);
  try{const user=await window.claude.use('user');if(user?.can?.('data.write')===false)S.ro=true}catch(_){}
  startSubs();
})();
</script>
